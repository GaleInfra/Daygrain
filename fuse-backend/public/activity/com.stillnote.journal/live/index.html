                //设置1秒后重试
                setTimeout(()=>{
                  renderLocalVideo();
                },1000)
              }else{
                //因为已经被释放
                rtc.isHaseLocalTrack = false;
              }
              return;
            }
            
            var iframeDocument = iframe.contentDocument || iframe.contentWindow.document;
            if(iframeDocument == null){
              //页面初始化失败
              if(rtc.client!= null){
                //设置1秒后重试
                setTimeout(()=>{
                  renderLocalVideo();
                },1000)
              }
              return;
            }
            localPlayerContainer = iframeDocument.getElementById("local-player-container");
            if(localPlayerContainer == null){
              //页面初始化失败
              if(rtc.client!= null){
                //设置1秒后重试
                setTimeout(()=>{
                  renderLocalVideo();
                },1000)
              }
              return;
            }
      


            rtc.isHaseLocalTrack =true;
             
            // Create a local video track from the video captured by a camera.
              console.log("joinChannel"," init localVideoTrack");
              try {
                if(rtc.localVideoTrack.isPlaying){
                    rtc.localVideoTrack.stop();
                  }
                  rtc.localVideoTrack.play(localPlayerContainer);
              } catch (error) {
                
              }
              if(rtc.isJoined){
                startPushStream();
              }
          }
          //开始推流

          async function startPushStream() {
            if(rtc.client == null){
              return;
            }
            var tracks = [];
            if(rtc.localVideoTrack != null){
                tracks.push(rtc.localVideoTrack);
            }
              
              if(rtc.localAudioTrack!= null){
                tracks.push(rtc.localAudioTrack);
              }
              console.log("joinChannel"," init localVideoTrack end");
              
              try {
                await rtc.client.publish(tracks);
              } catch (error) {
                await rtc.client.publish(tracks);
              }
          }


          //播放页面
          async function initLocalTrack() {
            if(rtc.client == null){
              return;
            }
           
            if(rtc.localVideoTrack == null){
                  console.log("joinChannel"," init localVideoTrack == null");
                  const cameraConfig = { facingMode: rtcCameraMode};
                 try {
                  rtc.localVideoTrack = await AgoraRTC.createCameraVideoTrack(cameraConfig);
                 } catch (error) {
                    console.log(error);
                 }
              }
              if(rtc.localAudioTrack == null){
                  console.log("joinChannel"," init localAudioTrack == null");
                 try {
                  rtc.localAudioTrack = await AgoraRTC.createMicrophoneAudioTrack();
                 } catch (error) {
                    console.log(error);
                 }
              }
              try {
                await renderLocalVideo();
              } catch (error) {
                
              }
          }
          

          async function moveLocalVideo() {
            //滑动中，停止渲染
            if(rtc.localVideoTrack != null && rtc.localVideoTrack.isEnabled){
              if(rtc.localVideoTrack.isPlaying){
              rtc.localVideoTrack.stop();
            }
            }
            
          }
          async function endMoveLocalVideo() {
            //滑动结束，重新渲染
            if( rtc.localVideoTrack != null && rtc.localVideoTrack.isEnabled){
              if(localPlayerContainer != null && !rtc.localVideoTrack.isPlaying){
                rtc.localVideoTrack.play(localPlayerContainer);
              }
            }
          }
          
          //销毁
          async function leaveChannel() {
            //因为已经被释放
            rtc.isHaseLocalTrack = false;
             // Destroy the local audio and video tracks.
             try {
               if(rtc.localVideoTrack != null){
                 if(rtc.localVideoTrack.isPlaying){
                   try {
                    rtc.localVideoTrack.stop();
                   } catch (error) {
                    
                   }
                 }

                  localPlayerContainer = null;
                 rtc.localVideoTrack.close();
                 rtc.localVideoTrack = null;
                 
               }
             } catch (error) {
               
             }

            try {
              if(rtc.localAudioTrack != null){
                if(rtc.localAudioTrack.isPlaying){
                  try {
                    rtc.localAudioTrack.stop();
                  } catch (error) {

                  }
                }
                rtc.localAudioTrack.close();
                rtc.localAudioTrack = null;
              }
            } catch (error) {
                
            }
           
               if(rtc.client != null){
                  try {
                  await rtc.client.leave();
                  } catch (error) { }
                  rtc.client = null;
               }

          }
          var rtcCameraMode = "user";
          // 切换摄像头
          function onOpenSwitchCamera() {
            rtcCameraMode = rtcCameraMode == "user" ? "environment" : "user";
            rtc.localVideoTrack.setDevice({facingMode: rtcCameraMode});
          }

          function onSwitchCamera() {
                // 调用 Flutter 依赖的方法，切换摄像头
                onSwitchCameraFlutter();
            }
            window.onSwitchCamera = onSwitchCamera;
