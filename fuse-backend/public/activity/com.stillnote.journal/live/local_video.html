<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Video Chat</title>

    </head>

    <body>
        <style>
            /* 全局样式 */
            body, html {
                margin: 0;
                padding: 0;
                height: 100%;
                width: 100%;
                display: flex;
                justify-content: center;
                align-items: center;
                background-color: #000;
            }
    
            .video-container {
                position: relative;
                width: 100%;
                height: 100%;
                cursor: move;
            }
    
            /* 对方的视频全屏显示 */
            .local-player-container {
                width: 100%;
                height: 100%;
                object-fit: cover;  /* 保持视频比例，裁剪填充整个区域 */
            }
    
          
          </style>
      <div class="video-container">
        <!-- 视频页面   远程视频沾满全屏， 自己的视频悬浮右上角-->
        <div id="local-player-container" class="local-player-container"></div>
 
        
      </div>
    
    </body>
</html>
